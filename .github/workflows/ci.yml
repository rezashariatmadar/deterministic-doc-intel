name: CI / CD & Evaluation Regression Gate

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  backend-and-eval-gate:
    name: Backend Lint, Unit Tests & Retrieval Eval Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: uv sync --frozen || uv sync

      - name: Run Ruff static analysis
        run: uv run ruff check .

      - name: Run unit tests
        run: uv run pytest tests/unit -v

      - name: Run Retrieval Ablation Regression Gate
        run: |
          uv run python -m evals.run_retrieval_eval --dry-run --output /tmp/ci_ablation.md
          cat /tmp/ci_ablation.md
          python3 -c '
          import sys
          content = open("/tmp/ci_ablation.md").read()
          lines = [line for line in content.splitlines() if "Full Pipeline" in line]
          if not lines:
              print("ERROR: Full Pipeline row not found in ablation report!", file=sys.stderr)
              sys.exit(1)
          cols = [c.strip() for c in lines[0].split("|") if c.strip()]
          recall_at_5 = float(cols[2])
          print(f"Verified Retrieval Gate: Recall@5 = {recall_at_5:.4f}")
          assert recall_at_5 >= 0.85, f"Regression detected: Recall@5 ({recall_at_5}) is below minimum floor 0.85!"
          '

  dashboard-build-and-rtl-gate:
    name: Dashboard Build, Vitest & RTL Logical Properties Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check if dashboard/package.json exists
        run: |
          if [ ! -f "dashboard/package.json" ]; then
            echo "ERROR: dashboard/package.json does not exist!"
            exit 1
          fi

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dashboard dependencies
        working-directory: dashboard
        run: npm ci || npm install

      - name: Enforce RTL logical properties (Zero physical direction classes)
        working-directory: dashboard
        run: |
          echo "Verifying zero physical directions in src/..."
          ! grep -rnE "\b(ml-|mr-|pl-|pr-|text-left|text-right|border-l-|border-r-|rounded-l-|rounded-r-|left-|right-)" src/

      - name: Run frontend unit & design audit tests
        working-directory: dashboard
        run: npm test

      - name: Build production dashboard
        working-directory: dashboard
        run: npm run build

